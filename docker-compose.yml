services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_PANEL_PUBLIC_URL: https://cloud.mahanmofagh.ir
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - bot_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bot_data:
  caddy_data:
  caddy_config:
