# Include this block inside the existing HTTPS `server` block for
# cloud.mahanmofagh.ir. The Docker admin service is intentionally bound only
# to 127.0.0.1, so it is reachable publicly only through this TLS proxy.

location = /admin {
    proxy_pass http://127.0.0.1:8787/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
