name: Fix unsupported-location recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-unsupported-location-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear stale location cache after upstream rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/mahan-location-catalog.js')
          s = p.read_text()
          old = "  } catch (error) {\n    await db.credit(userId, sale);\n    await bot.editMessageText(\n      `❌ ساخت سرور انجام نشد و مبلغ کامل به کیف پول برگشت داده شد.\\n\\n${friendlyError(error)}`,\n      { chat_id: chatId, message_id: statusMessage.message_id }\n    );\n  }"
          new = "  } catch (error) {\n    await db.credit(userId, sale);\n    const staleLocation = error instanceof CoreApiError && (\n      error.code === 'UNSUPPORTED_LOCATION' ||\n      /unsupported location for server type/i.test(String(error.message || ''))\n    );\n    if (staleLocation) cache.delete(validLocation);\n    await bot.editMessageText(\n      `❌ ساخت سرور انجام نشد و مبلغ کامل به کیف پول برگشت داده شد.\\n\\n${friendlyError(error)}${staleLocation ? '\\n\\nلیست این لوکیشن تازه‌سازی شد؛ لطفاً دوباره پلن را انتخاب کنید.' : ''}`,\n      {\n        chat_id: chatId,\n        message_id: statusMessage.message_id,\n        reply_markup: staleLocation ? { inline_keyboard: [[{ text: '🔄 پلن‌های معتبر این لوکیشن', callback_data: `mxloc:${validDuration}:${validLocation}` }]] } : undefined\n      }\n    );\n  }"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('buy catch marker not found')
          p.write_text(s)
          PY
          node --check src/mahan-location-catalog.js
          npm test
          git diff --check

      - name: Commit recovery fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mahan-location-catalog.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: refresh stale location catalog after rejected purchase'
            git push origin HEAD:main
          fi
