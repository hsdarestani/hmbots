name: Diagnose Mahan IP and billing

on:
  push:
    paths:
      - '.github/workflows/diagnose-mahan-ip-billing-20260920.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Inspect upstream API and production bot state
        env:
          HAMOON_API_KEY: ${{ secrets.HAMOON_API_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer $HAMOON_API_KEY")
          base="https://pay.hamooncloud.ir/api/v1"

          echo "=== upstream /me ==="
          curl -fsS --max-time 20 "${auth[@]}" "$base/me" | python3 -m json.tool || true

          echo "=== upstream /wallet ==="
          curl -fsS --max-time 20 "${auth[@]}" "$base/wallet" | python3 -m json.tool || true

          echo "=== upstream recent servers ==="
          curl -fsS --max-time 20 "${auth[@]}" "$base/servers"             | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("servers") or []; keep=["server_id","id","flavor_id","plan_id","duration","amount","status","public_ip","delivered_at","last_billed_at","pricing_mode","monthly_basis_price"]; print(json.dumps([{k:r.get(k) for k in keep} for r in rows[:30]],ensure_ascii=False,indent=2))' || true

          echo "=== upstream server 66621727 ==="
          curl -sS --max-time 20 "${auth[@]}" "$base/servers/66621727" | python3 -m json.tool || true

          echo "=== upstream prices (first 12) ==="
          curl -fsS --max-time 20 "${auth[@]}" "$base/prices"             | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"ok":d.get("ok"),"plans":[{"id":p.get("id"),"amount_hourly":p.get("amount_hourly"),"amount_monthly":p.get("amount_monthly")} for p in (d.get("plans") or [])[:12]]},ensure_ascii=False,indent=2))' || true

          echo "=== local Mahan bot sqlite rows ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASSWORD"
          SSH_ARGS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          sshpass -e ssh $SSH_ARGS "$SERVER_USER@$SERVER_IP" '
            set -eu
            cd /opt/mahan-cloud-bot
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              compose() { docker-compose "$@"; }
            fi
            CID="$(compose -p mahan-cloud-bot ps -q bot)"
            test -n "$CID"
            echo "--- local server rows ---"
            docker exec "$CID" node - <<'''NODE''' || true
const sqlite3=require("sqlite3").verbose();
const db=new sqlite3.Database("/app/data/bot.sqlite");
db.all("SELECT server_id,owner_id,plan_id,duration,sale_price,upstream_price,status,public_ip,location,next_billing_at,billing_state,deleted_at,created_at FROM servers ORDER BY created_at DESC LIMIT 30",[],(e,rows)=>{
  if(e){console.error(e.message);process.exitCode=1;} else console.log(JSON.stringify(rows,null,2));
  db.all("SELECT key,value FROM app_settings WHERE key IN (?,?,?,?,?)",["hourly_extra","monthly_markup","extra_ip_price","extra_traffic_tb_price","low_balance_threshold"],(e2,settings)=>{
    if(e2) console.error(e2.message); else console.log(JSON.stringify({settings},null,2));
    db.close();
  });
});
NODE
          '
